<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara Cay — an original island crime game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#0b1020; font-family:'Trebuchet MS',Verdana,sans-serif; color:#fff; }
  #game { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #status { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  .hidden { display:none !important; }
  /* Cinematic grade: teal-magenta wash, vignette and animated film grain over the 3D view. */
  #gradeFx { position:fixed; inset:0; pointer-events:none; z-index:5; mix-blend-mode:soft-light; opacity:.8;
    background:linear-gradient(125deg, rgba(0,140,170,.8), rgba(0,0,0,0) 48%, rgba(200,0,110,.75)); }
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:6;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(5,0,20,.42) 100%); }
  #grain { position:fixed; inset:0; pointer-events:none; z-index:7; opacity:.028;
    background:repeating-linear-gradient(0deg, #fff 0 1px, #000 1px 2px, #fff 2px 3px, #000 3px 4px); }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #topbar { position:absolute; top:12px; right:16px; text-align:right; }
  #cashBox { font-size:30px; font-weight:900; color:#7dff8a; text-shadow:0 2px 6px #000; }
  #stars { font-size:26px; color:#ffd166; letter-spacing:3px; text-shadow:0 2px 6px #000; min-height:32px; }
  #districtBox { background:rgba(5,10,25,.55); border-radius:8px; padding:4px 10px; }
  #districtName { font-weight:800; font-size:17px; }
  #districtRep { font-size:12px; color:#ffd166; }
  #rankBox { position:absolute; top:12px; left:16px; background:rgba(5,10,25,.55); border-radius:8px; padding:6px 10px; width:190px; }
  #rankTitle { font-weight:800; color:#6ee7ff; }
  #rpBar { height:8px; background:#223; border-radius:4px; margin:4px 0; overflow:hidden; }
  #rpFill { height:100%; width:0%; background:linear-gradient(90deg,#06d6a0,#ffd166); }
  #rpText { font-size:12px; }
  #missionBox { position:absolute; top:110px; left:16px; width:300px; background:rgba(5,10,25,.62); border-left:4px solid #ffd166; border-radius:8px; padding:8px 12px; }
  #missionTitle { font-weight:900; font-size:16px; color:#ffd166; }
  #missionGiver { font-size:12px; color:#ccc; margin-bottom:4px; }
  #missionStages { margin:4px 0; padding-left:16px; font-size:13px; }
  #missionStages li.done { color:#7dff8a; text-decoration:line-through; }
  #missionStages li.active { color:#fff; font-weight:700; }
  #missionStages li.todo { color:#99a; }
  #missionHint { font-size:12px; color:#6ee7ff; }
  #dispatchBox { position:absolute; top:158px; right:16px; width:230px; background:rgba(20,5,10,.62); border-left:4px solid #ef476f; border-radius:8px; padding:8px 10px; font-size:12px; }
  .dispatchHead { font-weight:900; color:#ef476f; letter-spacing:1px; }
  .unit { display:flex; justify-content:space-between; gap:6px; padding:2px 0; border-bottom:1px solid rgba(255,255,255,.12); }
  .unit span { color:#bbb; } .unit em { color:#ffd166; font-style:normal; }
  .unit.dim { color:#99a; } .unit.warn { color:#ff5566; font-weight:800; }
  #crewBox { position:absolute; left:16px; bottom:222px; display:flex; flex-direction:column; gap:5px; }
  .crew { background:rgba(5,10,25,.6); border-radius:7px; padding:4px 9px; font-size:12px; display:flex; gap:8px; }
  .crew span { color:#cdb4db; } .crew em { color:#7dff8a; font-style:normal; } .crew.cooling em { color:#ff9; }
  #weaponBox { position:absolute; right:16px; bottom:216px; text-align:right; }
  #weaponName { font-weight:900; font-size:18px; color:#ffd166; text-shadow:0 2px 5px #000; }
  #weaponSlots .slot { display:inline-block; background:rgba(5,10,25,.55); border-radius:5px; padding:2px 6px; margin-left:4px; font-size:11px; }
  #weaponSlots .slot.sel { background:#ffd166; color:#111; font-weight:800; }
  #radioBox { position:absolute; right:16px; bottom:188px; font-size:13px; color:#6ee7ff; text-shadow:0 1px 4px #000; }
  #activityBox { position:absolute; left:50%; transform:translateX(-50%); bottom:110px; text-align:center; font-weight:800; color:#ffd166; text-shadow:0 2px 6px #000; font-size:15px; }
  #minimap { position:absolute; left:16px; bottom:16px; width:190px; height:190px; }
  #speedBox { position:absolute; right:20px; bottom:140px; font-size:24px; font-weight:900; text-shadow:0 2px 6px #000; }
  #healthBar { position:absolute; left:50%; transform:translateX(-50%); bottom:22px; width:280px; height:12px; background:rgba(0,0,0,.55); border-radius:6px; overflow:hidden; }
  #healthFill { height:100%; width:100%; background:linear-gradient(90deg,#ef476f,#ffd166); }
  #toast { position:absolute; left:50%; transform:translateX(-50%); bottom:52px; background:rgba(5,10,25,.8); padding:8px 16px; border-radius:9px; font-size:15px; opacity:0; transition:opacity .25s; max-width:70%; text-align:center; }
  #toast.show { opacity:1; }
  #centerMsg { position:absolute; left:50%; top:32%; transform:translate(-50%,-50%); font-size:34px; font-weight:900; color:#ffd166; text-shadow:0 3px 12px #000; opacity:0; transition:opacity .3s; text-align:center; pointer-events:none; }
  #centerMsg.show { opacity:1; }
  #menu, #pauseMenu { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background:linear-gradient(160deg, rgba(2,40,60,.88), rgba(60,4,50,.88)); padding:20px; overflow:auto; }
  #menu h1 { font-size:64px; margin:0; letter-spacing:4px; color:#ffd166; text-shadow:0 4px 0 #ef476f, 0 8px 24px #000; }
  .tag { color:#6ee7ff; font-size:18px; margin:4px 0 10px; }
  .story { max-width:640px; line-height:1.5; color:#e8ecf4; }
  .controls { display:flex; flex-wrap:wrap; gap:6px 14px; justify-content:center; max-width:680px; margin:12px 0; font-size:13px; color:#cdd; }
  button { pointer-events:auto; cursor:pointer; font-size:18px; font-weight:800; padding:12px 28px; margin:5px; border:0; border-radius:10px; background:#ffd166; color:#14100a; }
  button:hover { background:#ffe29a; }
  #continueBtn { background:#06d6a0; }
  .fine { font-size:12px; color:#99a; }
  #pauseMenu h2 { font-size:40px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solara Cay: third-person open-world island game"></canvas>
<div id="gradeFx"></div><div id="vignette"></div><div id="grain"></div>
<div id="app"></div>
<p id="status" role="status" aria-live="polite"></p>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
